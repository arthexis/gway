[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gway"
version = "1.0.1"
description = "GitHub-backed project manager and universal command dispatcher"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [
  { name = "Rafael J. Guillén-Osorio", email = "tecnologia@gelectriic.com" },
]
dependencies = [
  "gway-sigils>=0.4.6,<0.5",
]

[project.optional-dependencies]
dev = [
  "Django>=4.2",
  "pytest>=8",
  "ruff>=0.12",
]

[project.scripts]
gway = "gway.bootstrap:main"

[project.urls]
Repository = "https://github.com/arthexis/gway"
Legacy = "https://github.com/arthexis/gway-legacy"

[tool.setuptools]
package-dir = {"" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
