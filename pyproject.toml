[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gway"
version = "1.0.0.dev0"
description = "GitHub-backed project manager and universal command dispatcher"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
  { name = "Rafael J. Guillén-Osorio", email = "tecnologia@gelectriic.com" },
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gway = "gway.cli:main"

[project.urls]
Repository = "https://github.com/arthexis/gway"
Legacy = "https://github.com/arthexis/gway-legacy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
