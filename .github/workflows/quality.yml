name: python / Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: python / Quality
    runs-on: ubuntu-latest
    env:
      VERSION_PR: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'version-only') }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version-only PR
        if: env.VERSION_PR == 'true'
        run: python3 .github/scripts/validate_version_only_pr.py "$BASE_SHA" "$HEAD_SHA"

      - uses: actions/setup-python@v7
        if: env.VERSION_PR != 'true'
        with:
          python-version: '3.13'
          cache: pip
      - name: Install CI tools
        if: env.VERSION_PR != 'true'
        run: python -m pip install --upgrade pip ruff
      - name: Install actionlint
        if: env.VERSION_PR != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: Ruff lint
        if: env.VERSION_PR != 'true'
        run: python -m ruff check gway tests
      - name: GitHub Actions workflow lint
        if: env.VERSION_PR != 'true'
        run: |
          "${RUNNER_TEMP}/actionlint" -shellcheck=
