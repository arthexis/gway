name: python / Python compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint (informational)
        continue-on-error: true
        run: python -m ruff check --config pyproject.toml src tests
      - name: Ruff format (informational)
        continue-on-error: true
        run: python -m ruff format --check --config pyproject.toml src tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.python-version }}" == "3.10" ]]; then
            python -m pip install "gway-sigils @ git+https://github.com/arthexis/sigils.git@4b4a22482627ac8039cc1c7e7fc94a793f55cfb8"
          fi
          python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest

  compatibility:
    name: python / Python compatibility
    needs: tests
    if: always() && needs.tests.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Python compatibility matrix result: $TEST_RESULT"
            exit 1
          fi
