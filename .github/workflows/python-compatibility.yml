name: python / Python compatibility
run-name: ${{ github.event_name == 'workflow_dispatch' && format('PR #{0} @ {1}', inputs.pr_number, inputs.head_sha) || github.workflow }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for label-driven CI
        required: false
        type: number
      base_sha:
        description: Pull request base SHA
        required: false
        type: string
      head_sha:
        description: Pull request head SHA
        required: false
        type: string
      head_repo:
        description: Pull request head repository
        required: false
        type: string
      version_pr:
        description: Whether version-only is active
        required: false
        type: boolean
      docs_pr:
        description: Whether docs-only is active
        required: false
        type: boolean
      workflow_pr:
        description: Whether workflow scope is active
        required: false
        type: boolean
      integration_pr:
        description: Whether integration scope is active
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Tests (Python 3.10)
    env:
      VERSION_PR: ${{ inputs.version_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'version-only')) }}
      DOCS_PR: ${{ inputs.docs_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docs-only')) }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_PR: ${{ inputs.workflow_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'workflow')) }}
      INTEGRATION_PR: ${{ inputs.integration_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration')) || (github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version-only PR
        if: env.VERSION_PR == 'true'
        run: python3 .github/scripts/validate_version_only_pr.py "$BASE_SHA" "$HEAD_SHA"
      - name: Validate docs-only PR
        if: env.DOCS_PR == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA"
          validator="$RUNNER_TEMP/validate_docs_only_pr.py"
          git show "$BASE_SHA:.github/scripts/validate_docs_only_pr.py" > "$validator"
          python3 "$validator" "$BASE_SHA" "$HEAD_SHA"

      - uses: actions/setup-python@v7
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Nginx template validation runtime
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx openssl
      - name: Install project and test tools
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,toml]'
      - name: Run project CI through Gway
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          if [[ "$INTEGRATION_PR" == "true" ]]; then
            timeout -s ABRT 300s python -m gway ci -o "$RUNNER_TEMP/ci-result.json"
          elif [[ "$WORKFLOW_PR" == "true" ]]; then
            timeout -s ABRT 300s python -m gway test run architecture - check --is 0
          else
            timeout -s ABRT 300s python -m gway test run --keyword "not architecture" - check --is 0
          fi
      - name: Publish structured CI result
        if: ${{ always() && env.VERSION_PR != 'true' && env.DOCS_PR != 'true' && env.INTEGRATION_PR == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: gway-ci-result
          path: ${{ runner.temp }}/ci-result.json
          if-no-files-found: ignore

  forward-compatibility:
    name: Compatibility (Python 3.13)
    env:
      VERSION_PR: ${{ inputs.version_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'version-only')) }}
      DOCS_PR: ${{ inputs.docs_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docs-only')) }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version-only PR
        if: env.VERSION_PR == 'true'
        run: python3 .github/scripts/validate_version_only_pr.py "$BASE_SHA" "$HEAD_SHA"
      - name: Validate docs-only PR
        if: env.DOCS_PR == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA"
          validator="$RUNNER_TEMP/validate_docs_only_pr.py"
          git show "$BASE_SHA:.github/scripts/validate_docs_only_pr.py" > "$validator"
          python3 "$validator" "$BASE_SHA" "$HEAD_SHA"

      - uses: actions/setup-python@v7
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        with:
          python-version: '3.13'
          cache: pip
      - name: Install forward-compatibility surface
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[toml]' pytest
      - name: Compile supported source tree
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: python -m compileall -q gway sampler
      - name: Validate maintained sampler recipes
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: python -m gway recipe check sampler
      - name: Smoke critical sampler recipes
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: python -m pytest -q --durations=20 tests/sampler/test_recipe_smoke.py
      - name: Verify newer-runtime contracts
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: |
          python -m pytest -q --durations=20 tests/gateway/test_builtins.py -k toml
          python -m pytest -q --durations=20 tests/install/test_metadata.py
      - name: CLI smoke
        if: env.VERSION_PR != 'true' && env.DOCS_PR != 'true'
        run: python -m gway help install >/dev/null

  compatibility:
    name: python / Python compatibility
    needs: [regression, forward-compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require baseline regression and forward compatibility
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          FORWARD_COMPATIBILITY_RESULT: ${{ needs.forward-compatibility.result }}
        run: |
          if [[ "$REGRESSION_RESULT" != "success" ]]; then
            echo "Python 3.10 regression result: $REGRESSION_RESULT"
            exit 1
          fi
          if [[ "$FORWARD_COMPATIBILITY_RESULT" != "success" ]]; then
            echo "Python 3.13 compatibility result: $FORWARD_COMPATIBILITY_RESULT"
            exit 1
          fi
