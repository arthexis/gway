# Publish only an exact SHA certified by Watchtower.
# The supplied SHA pair and run URL must match Arthexis' accepted deployment manifest.

name: python / Publish deployed package

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: "Exact repository SHA successfully deployed to Watchtower"
        required: true
        type: string
      companion_sha:
        description: "Exact companion repository SHA certified in the same Watchtower deployment"
        required: true
        type: string
      watchtower_run:
        description: "Watchtower workflow run URL that certified this SHA pair"
        required: true
        type: string

concurrency:
  group: pypi-publish-${{ inputs.deployed_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate deployed release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate SHA input
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "deployed_sha must be a full 40-character Git SHA." >&2
            exit 1
          }

      - name: Verify Watchtower certification
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          COMPANION_SHA: ${{ inputs.companion_sha }}
          WATCHTOWER_RUN: ${{ inputs.watchtower_run }}
        run: |
          set -Eeuo pipefail
          [[ "$COMPANION_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "companion_sha must be a full 40-character Git SHA." >&2
            exit 1
          }
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/arthexis/arthexis/watchtower-state/.watchtower/accepted.json" \
            --output "$manifest"
          MANIFEST="$manifest" OWN_FIELD="gway_sha" COMPANION_FIELD="arthexis_sha" \
          python - <<'PY'
          import json
          import os

          with open(os.environ["MANIFEST"], encoding="utf-8") as fh:
              manifest = json.load(fh)

          expected = {
              os.environ["OWN_FIELD"]: os.environ["DEPLOYED_SHA"],
              os.environ["COMPANION_FIELD"]: os.environ["COMPANION_SHA"],
              "run_url": os.environ["WATCHTOWER_RUN"],
          }
          mismatches = {
              key: (manifest.get(key), value)
              for key, value in expected.items()
              if manifest.get(key) != value
          }
          if mismatches:
              raise SystemExit(
                  "Release blocked: supplied certification does not match the accepted "
                  f"Watchtower manifest: {mismatches}"
              )
          print("watchtower_certification=verified")
          PY

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deployed_sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify exact deployed revision
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main || {
            echo "Release blocked: deployed SHA is not reachable from current main." >&2
            exit 1
          }

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install release tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions from deployed SHA
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke install wheel
        shell: bash
        run: |
          python -m venv /tmp/gway-pypi-smoke
          /tmp/gway-pypi-smoke/bin/python -m pip install --upgrade pip
          /tmp/gway-pypi-smoke/bin/python -m pip install dist/*.whl
          /tmp/gway-pypi-smoke/bin/python -m pip check
          /tmp/gway-pypi-smoke/bin/python -c 'import gway; print("gway import OK")'
          /tmp/gway-pypi-smoke/bin/gway --version

      - name: Generate release checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum dist/* | sed 's#  dist/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gway-dists-${{ inputs.deployed_sha }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: Reconcile deployed SHA on PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gway/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@v8
        with:
          name: gway-dists-${{ inputs.deployed_sha }}
          path: release-artifacts/

      - name: Inspect PyPI release state
        id: pypi
        shell: bash
        env:
          PACKAGE: "gway"
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          root = pathlib.Path("release-artifacts")
          expected = {}
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(None, 1)
              expected[filename.strip()] = digest

          url = f"https://pypi.org/pypi/{package}/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  state = "missing"
              else:
                  raise
          else:
              actual = {
                  item["filename"]: item["digests"]["sha256"]
                  for item in payload.get("urls", [])
              }
              if actual == expected:
                  state = "matching"
              else:
                  raise SystemExit(
                      "Release blocked: PyPI already contains this version with "
                      f"different artifacts. expected={expected!r} actual={actual!r}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"state={state}\n")
          print(f"pypi_state={state}")
          PY

      - name: Publish missing distributions
        if: steps.pypi.outputs.state == 'missing'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true

      - name: Verify PyPI release artifacts
        shell: bash
        env:
          PACKAGE: "gway"
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.request

          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          root = pathlib.Path("release-artifacts")
          expected = {}
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(None, 1)
              expected[filename.strip()] = digest

          url = f"https://pypi.org/pypi/{package}/{version}/json"
          actual = None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(2)
                  continue
              actual = {
                  item["filename"]: item["digests"]["sha256"]
                  for item in payload.get("urls", [])
              }
              if actual == expected:
                  break
              if attempt == 5:
                  raise SystemExit(
                      "PyPI release does not match certified artifacts after "
                      f"publication. expected={expected!r} actual={actual!r}"
                  )
              time.sleep(2)
          print("pypi_state=matching")
          PY

  github-release:
    name: Reconcile Git tag and GitHub Release
    needs: [build, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deployed_sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify certified checkout
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"

      - name: Download exact release artifacts
        uses: actions/download-artifact@v8
        with:
          name: gway-dists-${{ inputs.deployed_sha }}
          path: release-artifacts/

      - name: Reconcile release tag
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          direct="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"
          peeled="$(git ls-remote origin "refs/tags/$TAG^{}" | awk 'NR == 1 {print $1}')"
          target="${peeled:-$direct}"

          if [[ -z "$target" ]]; then
            git tag "$TAG" "$DEPLOYED_SHA"
            git push origin "$TAG"
            echo "tag_state=created"
          elif [[ "$target" == "$DEPLOYED_SHA" ]]; then
            echo "tag_state=matching"
          else
            echo "Release blocked: tag $TAG points to $target, expected $DEPLOYED_SHA." >&2
            exit 1
          fi

      - name: Reconcile GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          WATCHTOWER_RUN: ${{ inputs.watchtower_run }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          expected=(release-artifacts/dist/* release-artifacts/SHA256SUMS)
          (( ${#expected[@]} > 1 ))

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" "${expected[@]}"               --repo "${{ github.repository }}"               --title "gway v$VERSION"               --generate-notes               --notes "Published from Watchtower-certified SHA `$DEPLOYED_SHA`. Certified by: $WATCHTOWER_RUN"
            echo "github_release_state=created"
            exit 0
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          mapfile -t existing_names < <(
            gh release view "$TAG"               --repo "${{ github.repository }}"               --json assets               --jq '.assets[].name'
          )

          declare -A local_by_name=()
          for path in "${expected[@]}"; do
            local_by_name["$(basename "$path")"]="$path"
          done

          for name in "${existing_names[@]}"; do
            if [[ -z "${local_by_name[$name]+x}" ]]; then
              echo "Release blocked: unexpected existing asset $name on $TAG." >&2
              exit 1
            fi
            gh release download "$TAG"               --repo "${{ github.repository }}"               --pattern "$name"               --dir "$tmp"
            if ! cmp --silent "${local_by_name[$name]}" "$tmp/$name"; then
              echo "Release blocked: existing asset $name differs from certified artifact." >&2
              exit 1
            fi
          done

          for path in "${expected[@]}"; do
            name="$(basename "$path")"
            found=false
            for existing in "${existing_names[@]}"; do
              if [[ "$existing" == "$name" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" == "false" ]]; then
              gh release upload "$TAG" "$path" --repo "${{ github.repository }}"
              echo "uploaded_missing_asset=$name"
            fi
          done

          echo "github_release_state=matching"

      - name: Verify final GitHub release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          direct="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"
          peeled="$(git ls-remote origin "refs/tags/$TAG^{}" | awk 'NR == 1 {print $1}')"
          target="${peeled:-$direct}"
          test "$target" = "$DEPLOYED_SHA"

          shopt -s nullglob
          expected=(release-artifacts/dist/* release-artifacts/SHA256SUMS)
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for path in "${expected[@]}"; do
            name="$(basename "$path")"
            gh release download "$TAG"               --repo "${{ github.repository }}"               --pattern "$name"               --dir "$tmp"
            cmp --silent "$path" "$tmp/$name"
          done
          echo "release_state=matching"

  record-release:
    name: Record certified release manifest
    needs: [build, publish, github-release]
    if: ${{ needs.publish.result == 'success' && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@v8
        with:
          name: gway-dists-${{ inputs.deployed_sha }}
          path: release-artifacts/

      - name: Record immutable release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          PACKAGE: "gway"
          REPOSITORY: "${{ github.repository }}"
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          COMPANION_SHA: ${{ inputs.companion_sha }}
          WATCHTOWER_RUN: ${{ inputs.watchtower_run }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN is required to persist certified release evidence." >&2
            exit 1
          fi

          python - <<'PY' > release-manifest.json
          import json
          import os
          from pathlib import Path

          artifacts = {}
          for line in Path("release-artifacts/SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(None, 1)
              artifacts[filename.strip()] = {"sha256": digest}

          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          manifest = {
              "schema": 1,
              "package": package,
              "repository": repository,
              "version": version,
              "sha": os.environ["DEPLOYED_SHA"],
              "companion_sha": os.environ["COMPANION_SHA"],
              "watchtower_run": os.environ["WATCHTOWER_RUN"],
              "artifacts": artifacts,
              "publication": {
                  "pypi": {
                      "state": "published",
                      "url": f"https://pypi.org/project/{package}/{version}/",
                  },
                  "git_tag": {
                      "state": "published",
                      "name": tag,
                      "target_sha": os.environ["DEPLOYED_SHA"],
                  },
                  "github_release": {
                      "state": "published",
                      "url": f"https://github.com/{repository}/releases/tag/{tag}",
                  },
              },
          }
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

          target=".watchtower/releases/${PACKAGE}/${VERSION}.json"
          existing="$(mktemp)"
          trap 'rm -f "$existing"' EXIT

          if GH_TOKEN="$GH_TOKEN" gh api             -H "Accept: application/vnd.github.raw+json"             "/repos/arthexis/arthexis/contents/$target?ref=watchtower-state"             > "$existing" 2>/dev/null; then
            if cmp --silent release-manifest.json "$existing"; then
              echo "release_manifest=matching"
              exit 0
            fi
            echo "Release blocked: durable manifest $target already exists with different evidence." >&2
            diff -u "$existing" release-manifest.json || true
            exit 1
          fi

          encoded="$(base64 -w0 release-manifest.json)"
          GH_TOKEN="$GH_TOKEN" gh api             --method PUT             -H "Accept: application/vnd.github+json"             "/repos/arthexis/arthexis/contents/$target"             -f message="Record certified ${PACKAGE} ${VERSION} release"             -f content="$encoded"             -f branch="watchtower-state" >/dev/null
          echo "release_manifest=recorded"

  advance-version:
    name: Open next-version PR
    needs: [build, publish, github-release, record-release]
    if: ${{ needs.publish.result == 'success' && needs.github-release.result == 'success' && needs.record-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Advance version only
        id: bump
        shell: bash
        env:
          RELEASED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          released = os.environ["RELEASED_VERSION"]

          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', text)
          if not match:
              raise SystemExit("project.version not found")
          current = match.group(1)

          if current != released:
              print(
                  f"main already moved from released version {released} to {current}; "
                  "no automated bump is needed."
              )
              Path(os.environ["GITHUB_OUTPUT"]).write_text("changed=false\n", encoding="utf-8")
              raise SystemExit(0)

          parts = released.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(
                  f"Automatic next-version calculation requires X.Y.Z, got {released!r}. "
                  "Use a manual version bump for prerelease/final transitions."
              )
          major, minor, patch = map(int, parts)
          next_version = f"{major}.{minor}.{patch + 1}"

          updated = text[: match.start(1)] + next_version + text[match.end(1) :]
          path.write_text(updated, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("changed=true\n")
              output.write(f"next_version={next_version}\n")
          print(f"Advancing gway: {released} -> {next_version}")
          PY

      - name: Create version-only pull request
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_VERSION: ${{ needs.build.outputs.version }}
          NEXT_VERSION: ${{ steps.bump.outputs.next_version }}
          WATCHTOWER_RUN: ${{ inputs.watchtower_run }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          branch="release/advance-gway-v${RELEASED_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pyproject.toml
          test "$(git diff --cached --name-only)" = "pyproject.toml"
          git commit -m "chore(release): advance gway to v${NEXT_VERSION}"
          git push --force-with-lease origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Advance gway to v${NEXT_VERSION}" \
            --body "Published gway v${RELEASED_VERSION} from Watchtower-deployed SHA \`${DEPLOYED_SHA}\`.\n\nCertified by: ${WATCHTOWER_RUN}\n\nThis PR changes only the package version. Its merge must be ignored by Watchtower deployment triggers."
