name: Branch Update

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; leave blank to scan all open PRs
        required: false
        type: number

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: pr-drive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile PRs with Drive
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BRANCH_UPDATE_TOKEN }}
      GWAY_GITHUB_TOKEN: ${{ secrets.BRANCH_UPDATE_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      INPUT_PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Check out trusted reconciler
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Gway
        run: python -m pip install -e '.[toml]'

      - name: Reconcile selected pull requests
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${GWAY_GITHUB_TOKEN:-}" ]]; then
            echo "::error::BRANCH_UPDATE_TOKEN is not configured; Drive requires a token whose writes can trigger normal PR CI."
            exit 1
          fi

          results="$RUNNER_TEMP/drive-results"
          mkdir -p "$results"

          drive_pr() {
            local pr_number="$1"
            local result="$results/pr-${pr_number}.json"

            echo "Reconciling PR #$pr_number with GitHub Drive."
            python -m gway github drive "$REPOSITORY" "$pr_number" -o "$result"

            python - "$result" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          result_path, summary_path = sys.argv[1:]
          with open(result_path, encoding="utf-8") as handle:
              result = json.load(handle)

          actions = result.get("actions") or []
          applied = [item.get("kind") for item in actions if item.get("result") == "changed"]
          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write(
                  f"- PR #{result['pr']}: **{result['outcome']}** → "
                  f"`{result['final_status']}` / `{result['disposition']}`"
              )
              if applied:
                  summary.write(f"; applied: {', '.join(applied)}")
              if result.get("reason"):
                  summary.write(f"; reason: `{result['reason']}`")
              summary.write("\n")
          PY
          }

          case "$EVENT_NAME" in
            pull_request_target)
              drive_pr "$EVENT_PR_NUMBER"
              ;;
            workflow_dispatch)
              if [[ -n "${INPUT_PR_NUMBER:-}" ]]; then
                drive_pr "$INPUT_PR_NUMBER"
              else
                while IFS= read -r pr_number; do
                  drive_pr "$pr_number"
                done < <(
                  gh pr list --repo "$REPOSITORY" --state open --limit 1000 \
                    --json number --jq '.[].number'
                )
              fi
              ;;
            push)
              while IFS= read -r pr_number; do
                drive_pr "$pr_number"
              done < <(
                gh pr list --repo "$REPOSITORY" --state open --limit 1000 \
                  --json number --jq '.[].number'
              )
              ;;
          esac

      - name: Publish Drive results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: github-drive-results-${{ github.run_id }}
          path: ${{ runner.temp }}/drive-results/*.json
          if-no-files-found: ignore