name: python / Package

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for label-driven CI
        required: false
        type: number
      base_sha:
        description: Pull request base SHA
        required: false
        type: string
      head_sha:
        description: Pull request head SHA
        required: false
        type: string
      head_repo:
        description: Pull request head repository
        required: false
        type: string
      version_pr:
        description: Whether version-only is active
        required: false
        type: boolean
      workflow_pr:
        description: Whether workflow scope is active
        required: false
        type: boolean
      integration_pr:
        description: Whether integration scope is active
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: python / Package
    runs-on: ubuntu-latest
    env:
      VERSION_PR: ${{ inputs.version_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'version-only')) }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version-only PR
        if: env.VERSION_PR == 'true'
        run: python3 .github/scripts/validate_version_only_pr.py "$BASE_SHA" "$HEAD_SHA"

      - uses: actions/setup-python@v7
        if: env.VERSION_PR != 'true'
        with:
          python-version: '3.13'
          cache: pip
      - name: Build distributions
        if: env.VERSION_PR != 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
      - name: Validate wheel in clean environment
        if: env.VERSION_PR != 'true'
        run: |
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/python -m pip install --upgrade pip
          /tmp/clean-install/bin/python -m pip install dist/*.whl
          /tmp/clean-install/bin/python -m pip check
          /tmp/clean-install/bin/python -c "import gway; from gway import Gateway; Gateway(); print('gway import OK')"
          SOURCE_SAMPLER="$PWD/sampler"
          cd /tmp
          SOURCE_SAMPLER="$SOURCE_SAMPLER" /tmp/clean-install/bin/python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          from gway.sampler import load, root

          source = Path(os.environ["SOURCE_SAMPLER"])
          installed = root()

          def snapshot(tree):
              return {
                  path.relative_to(tree): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in tree.rglob("*")
                  if path.is_file()
                  and "__pycache__" not in path.parts
                  and path.suffix != ".pyc"
              }

          assert installed != source
          source_snapshot = snapshot(source)
          installed_snapshot = snapshot(installed)
          if installed_snapshot != source_snapshot:
              source_files = set(source_snapshot)
              installed_files = set(installed_snapshot)
              missing = sorted(source_files - installed_files)
              extra = sorted(installed_files - source_files)
              changed = sorted(
                  path
                  for path in source_files & installed_files
                  if source_snapshot[path] != installed_snapshot[path]
              )
              raise AssertionError(
                  f"sampler mismatch: missing={missing}, extra={extra}, changed={changed}"
              )
          assert load("web/app").AppSpec is not None
          PY
          /tmp/clean-install/bin/python -m gway help install >/dev/null

      - name: Rebuild wheel from sdist
        if: env.VERSION_PR != 'true'
        run: |
          rm -rf /tmp/sdist-build
          mkdir -p /tmp/sdist-build
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/sdist-build dist/*.tar.gz
          test -n "$(find /tmp/sdist-build -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m venv /tmp/sdist-install
          /tmp/sdist-install/bin/python -m pip install --upgrade pip
          /tmp/sdist-install/bin/python -m pip install /tmp/sdist-build/*.whl
          cd /tmp
          /tmp/sdist-install/bin/python -c "from gway.sampler import load, root; assert root().is_dir(); assert load('web/app').AppSpec is not None"
