name: python / Package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: python / Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
      - name: Validate wheel in clean environment
        run: |
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/python -m pip install --upgrade pip
          /tmp/clean-install/bin/python -m pip install dist/*.whl
          /tmp/clean-install/bin/python -m pip check
          /tmp/clean-install/bin/python -c "import gway; from gway import Gateway; Gateway(); print('gway import OK')"
          SOURCE_SAMPLER="$PWD/sampler"
          cd /tmp
          SOURCE_SAMPLER="$SOURCE_SAMPLER" /tmp/clean-install/bin/python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          from gway.sampler import load, root

          source = Path(os.environ["SOURCE_SAMPLER"])
          installed = root()

          def snapshot(tree):
              return {
                  path.relative_to(tree): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in tree.rglob("*")
                  if path.is_file()
                  and "__pycache__" not in path.parts
                  and path.suffix != ".pyc"
              }

          assert installed != source
          source_snapshot = snapshot(source)
          installed_snapshot = snapshot(installed)
          if installed_snapshot != source_snapshot:
              source_files = set(source_snapshot)
              installed_files = set(installed_snapshot)
              missing = sorted(source_files - installed_files)
              extra = sorted(installed_files - source_files)
              changed = sorted(
                  path
                  for path in source_files & installed_files
                  if source_snapshot[path] != installed_snapshot[path]
              )
              raise AssertionError(
                  f"sampler mismatch: missing={missing}, extra={extra}, changed={changed}"
              )
          assert load("web/app").AppSpec is not None
          PY
          /tmp/clean-install/bin/python -m gway help install >/dev/null
