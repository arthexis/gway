name: Approved Branch Update

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-approved:
    name: Update stale Approved PRs
    runs-on: ubuntu-latest
    steps:
      - name: Find and update stale Approved PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            label="$(jq -r '.label.name // empty' "$GITHUB_EVENT_PATH")"
            if [[ "$label" != "Approved" ]]; then
              echo "Ignoring non-Approved label event."
              exit 0
            fi
            pr_numbers=("$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")")
          else
            mapfile -t pr_numbers < <(
              gh pr list                 --repo "$REPOSITORY"                 --state open                 --label Approved                 --limit 1000                 --json number                 --jq '.[].number'
            )
          fi

          if (( ${#pr_numbers[@]} == 0 )); then
            echo "No open Approved pull requests."
            exit 0
          fi

          for pr_number in "${pr_numbers[@]}"; do
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"

            if [[ "$(jq -r '.state' <<< "$pr_json")" != "open" ]]; then
              continue
            fi

            if [[ "$(jq -r '.draft' <<< "$pr_json")" == "true" ]]; then
              echo "PR #$pr_number is draft; skipping."
              continue
            fi

            approved="$(jq -r '[.labels[].name] | any(. == "Approved")' <<< "$pr_json")"
            if [[ "$approved" != "true" ]]; then
              echo "PR #$pr_number is no longer Approved; skipping."
              continue
            fi

            base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
            head_sha="$(jq -r '.head.sha' <<< "$pr_json")"

            compare_json="$(gh api "repos/$REPOSITORY/compare/$base_ref...$head_sha")"
            behind_by="$(jq -r '.behind_by' <<< "$compare_json")"

            if [[ "$behind_by" == "0" ]]; then
              echo "PR #$pr_number is already current with $base_ref."
              continue
            fi

            echo "Updating PR #$pr_number ($behind_by commit(s) behind $base_ref)."

            if gh api               --method PUT               -H "Accept: application/vnd.github+json"               "repos/$REPOSITORY/pulls/$pr_number/update-branch"               -f expected_head_sha="$head_sha"
            then
              echo "PR #$pr_number updated successfully."
            else
              echo "PR #$pr_number could not be updated automatically (likely conflicts or branch restrictions)." >&2
            fi
          done
