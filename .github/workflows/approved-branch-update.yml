name: Branch Update

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stale:
    name: Update stale PRs
    runs-on: ubuntu-latest
    steps:
      - name: Find and update stale PRs
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_UPDATE_TOKEN: ${{ secrets.BRANCH_UPDATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            pr_numbers=("$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")")
          else
            mapfile -t pr_numbers < <(
              gh pr list \
                --repo "$REPOSITORY" \
                --state open \
                --limit 1000 \
                --json number \
                --jq '.[].number'
            )
          fi

          if (( ${#pr_numbers[@]} == 0 )); then
            echo "No open pull requests."
            exit 0
          fi

          if [[ -z "${BRANCH_UPDATE_TOKEN:-}" ]]; then
            echo "::error::BRANCH_UPDATE_TOKEN is not configured; refusing to update PRs with github.token because bot-authored updates suppress normal PR CI."
            exit 1
          fi

          for pr_number in "${pr_numbers[@]}"; do
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"

            if [[ "$(jq -r '.state' <<< "$pr_json")" != "open" ]]; then
              continue
            fi

            on_hold="$(
              jq -r '[.labels[].name | ascii_downcase] | any(. == "on hold")' <<< "$pr_json"
            )"
            if [[ "$on_hold" == "true" ]]; then
              echo "PR #$pr_number is on hold; skipping automatic branch update."
              continue
            fi

            head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
            if [[ "$head_repo" != "$REPOSITORY" ]]; then
              echo "PR #$pr_number is from a fork; skipping automatic branch update."
              continue
            fi

            base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
            head_sha="$(jq -r '.head.sha' <<< "$pr_json")"

            compare_json="$(gh api "repos/$REPOSITORY/compare/$base_ref...$head_sha")"
            behind_by="$(jq -r '.behind_by' <<< "$compare_json")"

            if [[ "$behind_by" == "0" ]]; then
              echo "PR #$pr_number is already current with $base_ref."
              continue
            fi

            echo "Updating PR #$pr_number ($behind_by commit(s) behind $base_ref)."

            if GH_TOKEN="$BRANCH_UPDATE_TOKEN" gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/pulls/$pr_number/update-branch" \
              -f expected_head_sha="$head_sha"
            then
              echo "PR #$pr_number updated successfully."
            else
              echo "PR #$pr_number could not be updated automatically (likely conflicts or branch restrictions)." >&2
            fi
          done
