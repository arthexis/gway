name: Clean Install

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel into clean environment
        run: |
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/python -m pip install --upgrade pip
          /tmp/clean-install/bin/python -m pip install dist/*.whl
          /tmp/clean-install/bin/python -m pip check
      - name: Installed package smoke checks
        run: |
          source /tmp/clean-install/bin/activate
          python -c "import gway; from gway import Gateway; Gateway(); print('gway import OK')"
          python -m gway help install >/dev/null
