name: Clean Install

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        continue-on-error: true
        run: python -m ruff check --config pyproject.toml src tests
      - name: Ruff format
        continue-on-error: true
        run: python -m ruff format --check --config pyproject.toml src tests

  clean-install:
    name: Clean Install
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel into clean environment
        run: |
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/python -m pip install --upgrade pip
          /tmp/clean-install/bin/python -m pip install dist/*.whl
          /tmp/clean-install/bin/python -m pip check
      - name: Installed package smoke checks
        run: |
          source /tmp/clean-install/bin/activate
          python -m gway --help
          gway --help
          gway upgrade --help
          python -c "import gway; print(gway.__version__)"
          gway install sigils
          bash -n install.sh
          ./install.sh --check
          cat install.sh | bash -s -- --check
          bash tests/test_system_installer.sh
