name: PR checks

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: arthexis/ci-base/.github/workflows/consumer-ci.yml@v1
    with:
      install-command: python -m pip install -e '.[dev]'
      lint-paths: src tests
      install-smoke-command: |
        python -m gway --help
        gway --help
        gway upgrade --help
        python -c "import gway; print(gway.__version__)"
        gway install sigils
        bash -n install.sh
        ./install.sh --check
        cat install.sh | bash -s -- --check
        bash tests/test_system_installer.sh

  linux-sanity:
    name: Linux sanity
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.mergeable_state != 'behind')
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Isolate GWAY state
        shell: bash
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/gway-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/gway-data" >> "$GITHUB_ENV"

      - name: Clean workspace
        run: git clean -ffdx

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install GWAY
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Run Linux sanity checks
        run: |
          set -euo pipefail
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m pytest -q
          python -m gway --help
          gway --help
          gway upgrade --help
          python -c "import gway; print(gway.__version__)"
          gway install sigils
          bash -n install.sh
          ./install.sh --check
          cat install.sh | bash -s -- --check
          bash tests/test_system_installer.sh
