name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install wheel in clean environment
        shell: bash
        run: |
          python -m venv /tmp/gway-wheel
          /tmp/gway-wheel/bin/python -m pip install --upgrade pip
          /tmp/gway-wheel/bin/python -m pip install dist/*.whl
          /tmp/gway-wheel/bin/python -m pip check
          /tmp/gway-wheel/bin/python -m gway --help
          /tmp/gway-wheel/bin/gway --help
          /tmp/gway-wheel/bin/python -c "import gway; print(gway.__version__)"
