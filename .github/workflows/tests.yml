name: PR checks

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: arthexis/ci-base/.github/workflows/consumer-ci.yml@v1
    with:
      install-command: python -m pip install -e '.[dev]'
      lint-paths: src tests
      install-smoke-command: |
        python -m gway --help
        gway --help
        gway upgrade --help
        python -c "import gway; print(gway.__version__)"
        gway install sigils
        bash -n install.sh
        ./install.sh --check
        cat install.sh | bash -s -- --check
        bash tests/test_system_installer.sh
