name: gway / Log artifact

on:
  pull_request:
    paths:
      - 'src/gway/logging.py'
      - 'src/gway/log_command.py'
      - 'src/gway/runtime.py'
      - 'src/gway/bootstrap.py'
      - 'tests/test_log_command.py'
      - '.github/workflows/log-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log-artifact:
    runs-on: ubuntu-latest
    env:
      GWAY_LOG_DIR: ${{ runner.temp }}/gway-local
      GWAY_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Test logging
        run: python -m pytest tests/test_log_command.py
      - name: Exercise recipe log destination
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/log-artifact.rx" <<'EOF'
          log --tags ci,github-actions --to [log_destination]
          EOF
          gway --json recipe "${RUNNER_TEMP}/log-artifact.rx" \
            --log_destination "${RUNNER_TEMP}/gway-upload"
          test -s "${RUNNER_TEMP}/gway-upload/${GWAY_RUN_ID}/events.jsonl"
      - name: Upload GWAY logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gway-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gway-upload/
          if-no-files-found: warn
