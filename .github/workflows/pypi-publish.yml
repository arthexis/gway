# Publish only an exact SHA certified by Watchtower.
# The supplied SHA pair and run URL must match Arthexis' accepted deployment manifest.

name: python / Publish deployed package

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: "Exact repository SHA successfully deployed to Watchtower"
        required: true
        type: string
      companion_sha:
        description: "Exact companion repository SHA certified in the same Watchtower deployment"
        required: true
        type: string
      watchtower_run:
        description: "Watchtower workflow run URL that certified this SHA pair"
        required: true
        type: string

concurrency:
  group: pypi-publish-${{ inputs.deployed_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate deployed release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate SHA input
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "deployed_sha must be a full 40-character Git SHA." >&2
            exit 1
          }

      - name: Verify Watchtower certification
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          COMPANION_SHA: ${{ inputs.companion_sha }}
          WATCHTOWER_RUN: ${{ inputs.watchtower_run }}
        run: |
          set -Eeuo pipefail
          [[ "$COMPANION_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "companion_sha must be a full 40-character Git SHA." >&2
            exit 1
          }
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/arthexis/arthexis/watchtower-state/.watchtower/accepted.json" \
            --output "$manifest"
          MANIFEST="$manifest" OWN_FIELD="gway_sha" COMPANION_FIELD="arthexis_sha" \
          python - <<'PY'
          import json
          import os

          with open(os.environ["MANIFEST"], encoding="utf-8") as fh:
              manifest = json.load(fh)

          expected = {
              os.environ["OWN_FIELD"]: os.environ["DEPLOYED_SHA"],
              os.environ["COMPANION_FIELD"]: os.environ["COMPANION_SHA"],
              "run_url": os.environ["WATCHTOWER_RUN"],
          }
          mismatches = {
              key: (manifest.get(key), value)
              for key, value in expected.items()
              if manifest.get(key) != value
          }
          if mismatches:
              raise SystemExit(
                  "Release blocked: supplied certification does not match the accepted "
                  f"Watchtower manifest: {mismatches}"
              )
          print("watchtower_certification=verified")
          PY

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deployed_sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify exact deployed revision
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main || {
            echo "Release blocked: deployed SHA is not reachable from current main." >&2
            exit 1
          }

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version is not already published
        shell: bash
        env:
          PACKAGE: "gway"
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/{package}/json"
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  releases = json.load(response).get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  releases = {}
              else:
                  raise
          if version in releases:
              raise SystemExit(
                  f"Release blocked: {package} {version} already exists on PyPI. "
                  "Do not publish a second SHA under the same version."
              )
          print(f"{package} {version} is available for publication.")
          PY

      - name: Install release tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions from deployed SHA
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke install wheel
        shell: bash
        run: |
          python -m venv /tmp/gway-pypi-smoke
          /tmp/gway-pypi-smoke/bin/python -m pip install --upgrade pip
          /tmp/gway-pypi-smoke/bin/python -m pip install dist/*.whl
          /tmp/gway-pypi-smoke/bin/python -m pip check
          /tmp/gway-pypi-smoke/bin/python -c 'import gway; print("gway import OK")'
          /tmp/gway-pypi-smoke/bin/gway --version

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gway-dists-${{ inputs.deployed_sha }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish deployed SHA to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gway/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@v8
        with:
          name: gway-dists-${{ inputs.deployed_sha }}
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  github-release:
    name: Create GitHub Release
    needs: [build, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@v8
        with:
          name: gway-dists-${{ inputs.deployed_sha }}
          path: dist/

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd dist
            sha256sum * > SHA256SUMS
          )

      - name: Ensure release tag is unused
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release blocked: tag $TAG already exists." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release blocked: GitHub Release $TAG already exists." >&2
            exit 1
          fi

      - name: Create tag and GitHub Release from deployed SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          WATCHTOWER_RUN: ${{ inputs.watchtower_run }}
        run: |
          set -Eeuo pipefail
          git tag "$TAG" "$DEPLOYED_SHA"
          git push origin "$TAG"
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "gway v$VERSION" \
            --generate-notes \
            --notes "Published from Watchtower-certified SHA `$DEPLOYED_SHA`. Certified by: $WATCHTOWER_RUN"

  advance-version:
    name: Open next-version PR
    needs: [build, publish, github-release]
    if: ${{ needs.publish.result == 'success' && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Advance version only
        id: bump
        shell: bash
        env:
          RELEASED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          released = os.environ["RELEASED_VERSION"]

          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', text)
          if not match:
              raise SystemExit("project.version not found")
          current = match.group(1)

          if current != released:
              print(
                  f"main already moved from released version {released} to {current}; "
                  "no automated bump is needed."
              )
              Path(os.environ["GITHUB_OUTPUT"]).write_text("changed=false\n", encoding="utf-8")
              raise SystemExit(0)

          parts = released.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(
                  f"Automatic next-version calculation requires X.Y.Z, got {released!r}. "
                  "Use a manual version bump for prerelease/final transitions."
              )
          major, minor, patch = map(int, parts)
          next_version = f"{major}.{minor}.{patch + 1}"

          updated = text[: match.start(1)] + next_version + text[match.end(1) :]
          path.write_text(updated, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("changed=true\n")
              output.write(f"next_version={next_version}\n")
          print(f"Advancing gway: {released} -> {next_version}")
          PY

      - name: Create version-only pull request
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
          RELEASED_VERSION: ${{ needs.build.outputs.version }}
          NEXT_VERSION: ${{ steps.bump.outputs.next_version }}
          WATCHTOWER_RUN: ${{ inputs.watchtower_run }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -Eeuo pipefail
          branch="release/advance-gway-v${RELEASED_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pyproject.toml
          test "$(git diff --cached --name-only)" = "pyproject.toml"
          git commit -m "chore(release): advance gway to v${NEXT_VERSION}"
          git push --force-with-lease origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Advance gway to v${NEXT_VERSION}" \
            --body "Published gway v${RELEASED_VERSION} from Watchtower-deployed SHA \`${DEPLOYED_SHA}\`.\n\nCertified by: ${WATCHTOWER_RUN}\n\nThis PR changes only the package version. Its merge must be ignored by Watchtower deployment triggers."
