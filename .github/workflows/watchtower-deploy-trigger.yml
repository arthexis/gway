name: Watchtower Deploy Trigger

on:
  workflow_run:
    workflows: ["python / Python compatibility"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trigger:
    name: Trigger Arthexis Watchtower Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve validated Gway main SHA
        id: validated
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          remote_main="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          test -n "$remote_main"

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$VALIDATED_SHA"
            test -n "$sha"
            if [[ "$sha" != "$remote_main" ]]; then
              echo "Validated Gway SHA $sha is stale; current main is $remote_main." >&2
              exit 1
            fi
          else
            sha="$remote_main"
            conclusion="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/python-compatibility.yml/runs?branch=main&event=push&head_sha=$sha&status=completed&per_page=20" \
                --jq '.workflow_runs | map(select(.conclusion == "success")) | first | .conclusion // empty'
            )"
            if [[ "$conclusion" != "success" ]]; then
              echo "Manual deploy blocked: Gway main $sha has no successful full Python compatibility run." >&2
              exit 1
            fi
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "validated_gway_sha=$sha"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.validated.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify validated Gway change
        id: classify
        shell: bash
        env:
          CURRENT_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -Eeuo pipefail

          before="$(git rev-parse "$CURRENT_SHA^" 2>/dev/null || true)"
          if [[ -z "$before" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA="$before" CURRENT_SHA="$CURRENT_SHA" python - <<'PY'
          import os
          import re
          import subprocess

          before = os.environ["BEFORE_SHA"]
          current = os.environ["CURRENT_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", before, current], text=True
          ).splitlines()

          version_only = False
          if changed == ["pyproject.toml"]:
              old = subprocess.check_output(
                  ["git", "show", f"{before}:pyproject.toml"], text=True
              )
              new = subprocess.check_output(
                  ["git", "show", f"{current}:pyproject.toml"], text=True
              )
              pattern = re.compile(r'(?m)^(version\s*=\s*")[^"]+(".*)$')
              if pattern.search(old) and pattern.search(new):
                  old_normalized = pattern.sub(r'\1<VERSION>\2', old, count=1)
                  new_normalized = pattern.sub(r'\1<VERSION>\2', new, count=1)
                  version_only = old != new and old_normalized == new_normalized

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"deploy={'false' if version_only else 'true'}\n")
          print("version_only=" + ("true" if version_only else "false"))
          PY

      - name: Dispatch Watchtower Deploy with exact validated Gway SHA
        if: steps.classify.outputs.deploy == 'true'
        shell: bash
        env:
          WATCHTOWER_DEPLOY_TOKEN: ${{ secrets.WATCHTOWER_DEPLOY_TOKEN }}
          GWAY_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${WATCHTOWER_DEPLOY_TOKEN}" ]]; then
            echo "WATCHTOWER_DEPLOY_TOKEN Actions secret is required." >&2
            exit 1
          fi

          payload="$(printf '{"ref":"main","inputs":{"gway_sha":"%s"}}' "$GWAY_SHA")"

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${WATCHTOWER_DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/arthexis/arthexis/actions/workflows/watchtower-deploy.yml/dispatches" \
            --data "$payload"

          echo "watchtower_deploy=dispatched"
          echo "gway_sha=${GWAY_SHA}"
