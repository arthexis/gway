name: Watchtower Deploy Trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger Arthexis Watchtower Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm main deployment source
        if: github.event_name == 'push'
        env:
          GWAY_SHA: ${{ github.sha }}
        run: |
          echo "gway_sha=${GWAY_SHA}"

      - name: Dispatch Watchtower Deploy
        shell: bash
        env:
          WATCHTOWER_DEPLOY_TOKEN: ${{ secrets.WATCHTOWER_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${WATCHTOWER_DEPLOY_TOKEN}" ]]; then
            echo "WATCHTOWER_DEPLOY_TOKEN Actions secret is required." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${WATCHTOWER_DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/arthexis/arthexis/actions/workflows/watchtower-deploy.yml/dispatches" \
            --data '{"ref":"main"}'

          echo "watchtower_deploy=dispatched"
