name: Cleanup retired scope publication

on:
  push:
    branches:
      - feature/curated-scope-authority
    paths:
      - .github/workflows/cleanup-retired-scope-publication.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/curated-scope-authority
          fetch-depth: 0

      - name: Remove retired publication machinery
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          config = Path("gway/config.py")
          text = config.read_text(encoding="utf-8")
          start = text.index("def project_scopes(")
          end = text.index("def project_survey(", start)
          text = text[:start] + text[end:]

          start = text.index("def _publish_project_capabilities(")
          end = text.index("def _discover_installed_capabilities(", start)
          survey_helper = '''def _publish_project_survey(runtime, data, *, source):
              """Merge one project's declarative Survey contributions into runtime state."""
              contributors = list(getattr(runtime, "_survey_contributors", ()))
              by_section = {item["section"]: item for item in contributors}
              for contributor in project_survey(data, source=source):
                  existing = by_section.get(contributor["section"])
                  if existing is not None and existing["command"] != contributor["command"]:
                      raise ValueError(
                          f"Published Survey section collision: {contributor['section']}"
                      )
                  if existing is None:
                      contributors.append(contributor)
                      by_section[contributor["section"]] = contributor

              runtime._survey_contributors = tuple(contributors)
              return tuple(contributors)


          '''
          text = text[:start] + survey_helper + text[end:]

          old_discovery = '''def _discover_installed_capabilities(runtime, installations):
              """Discover declarative capabilities without importing installed product code."""
              from . import toml

              runtime._published_scopes = {}
              runtime._survey_contributors = ()
              for installation in installations:
                  project_file = installation.install_path / "pyproject.toml"
                  if not project_file.is_file():
                      continue
                  data = toml.load(project_file)
                  _publish_project_capabilities(
                      runtime,
                      data,
                      source=installation.name,
                  )
          '''
          new_discovery = '''def _discover_installed_surveys(runtime, installations):
              """Discover declarative Survey contributions without importing product code."""
              from . import toml

              runtime._survey_contributors = ()
              for installation in installations:
                  project_file = installation.install_path / "pyproject.toml"
                  if not project_file.is_file():
                      continue
                  data = toml.load(project_file)
                  _publish_project_survey(
                      runtime,
                      data,
                      source=installation.name,
                  )
          '''
          if old_discovery not in text:
              raise SystemExit("gway/config.py: installed capability discovery block changed")
          text = text.replace(old_discovery, new_discovery, 1)
          text = text.replace(
              "    _discover_installed_capabilities(runtime, discovered.values())\n",
              "    _discover_installed_surveys(runtime, discovered.values())\n",
              1,
          )
          text = text.replace(
              "    _publish_project_capabilities(runtime, data, source=guide_source)\n",
              "    _publish_project_survey(runtime, data, source=guide_source)\n",
              1,
          )
          config.write_text(text, encoding="utf-8")

          replace_once(
              "gway/gateway.py",
              '''    def converge_security_scopes(self, *, retire_missing=True):
                  """Converge discovered scope policy into durable security state on demand."""
                  from .security.defaults import converge_scope_registry
                  from .security.scopes import ScopeRegistry

                  return converge_scope_registry(
                      ScopeRegistry(self.security_path),
                      getattr(self, "_published_scopes", {}),
                      retire_missing=retire_missing,
                  )
          ''',
              '''    def converge_security_scopes(self, *, retire_missing=True):
                  """Converge bundled Gway scope policy into durable security state."""
                  from .security.defaults import converge_scope_registry
                  from .security.scopes import ScopeRegistry

                  return converge_scope_registry(
                      ScopeRegistry(self.security_path),
                      retire_missing=retire_missing,
                  )
          ''',
          )

          replace_once(
              "gway/remote/server.py",
              '''        published_scopes = (
                      {} if runtime is None else getattr(runtime, "_published_scopes", {})
                  )
                  converge_scope_registry(
                      self.account.oauth.scopes,
                      published_scopes,
                      retire_missing=False,
                  )
          ''',
              '''        converge_scope_registry(
                      self.account.oauth.scopes,
                      retire_missing=False,
                  )
          ''',
          )

          defaults = Path("gway/security/defaults.py")
          text = defaults.read_text(encoding="utf-8")
          text = text.replace(
              '''def converge_scope_registry(
              registry,
              published=(),
              *,
              retire_missing=True,
              report=False,
          ):
          ''',
              '''def converge_scope_registry(
              registry,
              *,
              retire_missing=True,
              report=False,
          ):
          ''',
              1,
          )
          text = text.replace(
              '''    Product/Django/Odoo ingestion exposes operations but no longer publishes
              authorization scopes. Existing generated project scopes are retired during
              writable convergence; user-managed scopes remain untouched.
              """
              del published
          ''',
              '''    Operation ingestion never manufactures authorization scopes. Existing
              generated project scopes are retired during writable convergence; user-managed
              scopes remain untouched.
              """
          ''',
              1,
          )
          defaults.write_text(text, encoding="utf-8")

          Path("gway/security/publication.py").unlink()

      - name: Verify retired symbols are gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '_published_scopes|project_scopes|_publish_project_capabilities|PublishedScope|normalize_publications|security\.publication' gway tests; then
            echo 'Retired publication symbols remain' >&2
            exit 1
          fi

      - name: Run focused authorization and ingestion tests
        run: >-
          python -m pytest -q
          tests/security/test_curated_scope_validation.py
          tests/test_project_capabilities.py
          tests/ingestion/django/test_project.py
          tests/ingestion/django/test_commands.py
          tests/sampler/test_odoo.py
          tests/remote/test_server.py

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-retired-scope-publication.yml
          git add -A
          git commit -m 'refactor: remove retired project scope publication path'
          git push origin HEAD:feature/curated-scope-authority
