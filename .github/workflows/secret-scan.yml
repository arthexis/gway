name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 120 \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/gitleaks-bin"
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            "${RUNNER_TEMP}/gitleaks-bin" git --redact --no-banner --exit-code 1 \
              --log-opts="-1 $SHA"
          else
            "${RUNNER_TEMP}/gitleaks-bin" git --redact --no-banner --exit-code 1 \
              --log-opts="$BEFORE..$SHA"
          fi
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "${RUNNER_TEMP}/gitleaks-bin" git --redact --no-banner --exit-code 1 \
            --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: Scan current tree
        if: github.event_name == 'workflow_dispatch'
        run: "${RUNNER_TEMP}/gitleaks-bin detect --source . --no-git --redact --no-banner --exit-code 1"
