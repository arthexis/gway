name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for label-driven CI
        required: false
        type: number
      base_sha:
        description: Pull request base SHA
        required: false
        type: string
      head_sha:
        description: Pull request head SHA
        required: false
        type: string
      version_pr:
        description: Whether version-only is active
        required: false
        type: boolean
      workflow_pr:
        description: Whether workflow scope is active
        required: false
        type: boolean
      integration_pr:
        description: Whether integration scope is active
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      VERSION_PR: ${{ inputs.version_pr || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'version-only')) }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version-only PR
        if: env.VERSION_PR == 'true'
        run: python3 .github/scripts/validate_version_only_pr.py "$BASE_SHA" "$HEAD_SHA"

      - name: Install Gitleaks
        if: env.VERSION_PR != 'true'
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 120 \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/gitleaks-bin"
      - name: Scan pushed commits
        if: env.VERSION_PR != 'true' && github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            "${RUNNER_TEMP}/gitleaks-bin" git --redact --no-banner --exit-code 1 \
              --log-opts="-1 $SHA"
          else
            "${RUNNER_TEMP}/gitleaks-bin" git --redact --no-banner --exit-code 1 \
              --log-opts="$BEFORE..$SHA"
          fi
      - name: Scan pull request commits
        if: env.VERSION_PR != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "${RUNNER_TEMP}/gitleaks-bin" git --redact --no-banner --exit-code 1 \
            --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: Scan current tree
        if: env.VERSION_PR != 'true' && github.event_name == 'workflow_dispatch'
        run: "${RUNNER_TEMP}/gitleaks-bin detect --source . --no-git --redact --no-banner --exit-code 1"
