name: Gateway Rebuild Smoke

on:
  push:
    branches:
      - gateway-rebuild
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[toml]"
          python -m pip install pytest

      - name: Verify import
        run: |
          python -c "import gway; from gway import Gateway; Gateway(); print('gway import OK')"

      - name: Run core test suite
        run: python -m pytest -q
