name: Gateway Rebuild CI

on:
  push:
    branches:
      - gateway-rebuild
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,toml]"

      - name: Ruff lint
        run: python -m ruff check gway tests

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,toml]"

      - name: Verify import
        run: |
          python -c "import gway; from gway import Gateway; Gateway(); print('gway import OK')"

      - name: Run full test suite
        run: python -m pytest -q
