name: Approved Auto-Merge

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - "python / Package"
      - "python / Python compatibility"
      - "python / Quality"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write

jobs:
  arm-auto-merge:
    name: Arm approved PR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_run)
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              if [[ -z "$pr_number" ]]; then
                head_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
                if [[ -n "$head_sha" ]]; then
                  pr_number="$(gh api "repos/$REPOSITORY/commits/$head_sha/pulls" --jq '[.[] | select(.state == "open" and .head.sha == "'"$head_sha"'")][0].number // empty')"
                fi
              fi
              ;;
            workflow_dispatch)
              pr_number="$INPUT_PR"
              ;;
            *)
              pr_number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
              ;;
          esac

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with this event."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Mark approved PR ready for review
        if: steps.pr.outputs.skip != 'true' && github.event_name == 'pull_request_target' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          label="$(jq -r '.label.name // empty | ascii_downcase' "$GITHUB_EVENT_PATH")"
          if [[ "$label" != "approved" ]]; then
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          draft="$(jq -r '.draft' <<< "$pr_json")"
          if [[ "$draft" == "true" ]]; then
            echo "PR #$PR_NUMBER was approved while draft; marking ready for review."
            gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
          fi

      - name: Reconcile mutually exclusive work-state labels
        if: steps.pr.outputs.skip != 'true' && github.event_name == 'pull_request_target' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          label="$(jq -r '.label.name // empty | ascii_downcase' "$GITHUB_EVENT_PATH")"
          if [[ "$label" != "in-progress" && "$label" != "approved" ]]; then
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          approved="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "approved")' <<< "$pr_json"
          )"
          in_progress="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "in-progress")' <<< "$pr_json"
          )"

          if [[ "$approved" == "true" && "$in_progress" == "true" ]]; then
            case "$label" in
              approved)
                echo "PR #$PR_NUMBER was newly approved; removing in-progress."
                gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --remove-label in-progress
                ;;
              in-progress)
                echo "PR #$PR_NUMBER was newly marked in-progress; removing Approved."
                gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --remove-label approved
                ;;
            esac
          fi

      - name: Disarm when approval is removed or PR is on-hold
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          approved="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "approved")' <<< "$pr_json"
          )"
          on_hold="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "on-hold" or . == "on hold")' <<< "$pr_json"
          )"
          in_progress="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "in-progress")' <<< "$pr_json"
          )"

          if [[ "$approved" != "true" || "$on_hold" == "true" || "$in_progress" == "true" ]]; then
            echo "Disabling auto-merge for PR #$PR_NUMBER (approved=$approved, on_hold=$on_hold, in_progress=$in_progress)."
            gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --disable-auto || true
          fi

      - name: Reset stale auto-merge request
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Reconciliation is head-specific. Clear any request armed for an older
          # revision before validating and re-arming the current head.
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --disable-auto || true

      - name: Validate approval gate
        if: steps.pr.outputs.skip != 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"

          state="$(jq -r '.state' <<< "$pr_json")"
          draft="$(jq -r '.draft' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"

          if [[ "$state" != "open" || "$draft" == "true" ]]; then
            echo "PR #$PR_NUMBER is not an open, non-draft PR."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          on_hold="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "on-hold" or . == "on hold")' <<< "$pr_json"
          )"
          if [[ "$on_hold" == "true" ]]; then
            echo "PR #$PR_NUMBER is on-hold; auto-merge is disabled."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          in_progress="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "in-progress")' <<< "$pr_json"
          )"
          if [[ "$in_progress" == "true" ]]; then
            echo "PR #$PR_NUMBER is in progress; approval must be granted again after work is complete."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          approved="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "approved")' <<< "$pr_json"
          )"
          if [[ "$approved" != "true" ]]; then
            echo "PR #$PR_NUMBER does not have the Approved label."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare_json="$(gh api "repos/$REPOSITORY/compare/$base_ref...$head_sha")"
          behind_by="$(jq -r '.behind_by' <<< "$compare_json")"
          if [[ "$behind_by" != "0" ]]; then
            echo "PR #$PR_NUMBER is $behind_by commit(s) behind $base_ref."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          required_checks="$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --required --json name,bucket 2>&1)"
          required_status=$?
          set -e

          if (( required_status != 0 )); then
            if grep -Fq "no required checks reported" <<< "$required_checks"; then
              required_checks="$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --json name,bucket)"
              required_checks="$(
                jq '[.[] | select(.name == "python / Package" or .name == "python / Python compatibility" or .name == "python / Quality" or .name == "Secret Scan")]' <<< "$required_checks"
              )"
              expected="$(jq 'length' <<< "$required_checks")"
              if [[ "$expected" != "4" ]]; then
                echo "Expected four core CI checks on a branch without required checks; found $expected."
                echo "$required_checks" | jq -r '.[] | "  \(.name): \(.bucket)"'
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "No required-check rules on $base_ref; validating the four core CI checks instead."
            else
              echo "$required_checks"
              exit "$required_status"
            fi
          fi

          incomplete="$(
            jq '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | length' <<< "$required_checks"
          )"
          if [[ "$incomplete" != "0" ]]; then
            echo "CI is not fully successful yet."
            echo "$required_checks" | jq -r '.[] | "  \(.name): \(.bucket)"'
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Approval, freshness, and CI gates are satisfied for PR #$PR_NUMBER."
          echo "The PR is not marked in-progress."
          echo "Review-thread resolution is enforced by the protected branch ruleset."
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER"             --repo "$REPOSITORY"             --auto             --merge             --match-head-commit "$HEAD_SHA"
