name: Approved Auto-Merge

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - "python / Package"
      - "python / Python compatibility"
      - "python / Quality"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read
  actions: write

jobs:
  arm-auto-merge:
    name: Arm approved PR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_run)
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_dispatch)
              pr_number="$INPUT_PR"
              ;;
            *)
              pr_number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
              ;;
          esac

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with this event."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Disarm when approval is removed or PR is on-hold
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          approved="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "approved")' <<< "$pr_json"
          )"
          on_hold="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "on-hold")' <<< "$pr_json"
          )"

          if [[ "$approved" != "true" || "$on_hold" == "true" ]]; then
            echo "Disabling auto-merge for PR #$PR_NUMBER (approved=$approved, on_hold=$on_hold)."
            gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --disable-auto || true
          fi

      - name: Wait for PR changes to settle
        id: settle
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          changed_at="$(jq -r '.updated_at // empty' <<< "$pr_json")"

          if [[ -z "$changed_at" || "$changed_at" == "null" ]]; then
            echo "Unable to determine the server-observed time for head $head_sha; refusing to arm auto-merge."
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A synchronize event can leave an older auto-merge request armed.
          # Disarm it before waiting so the PR cannot merge during this settling window.
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --disable-auto || true

          changed_epoch="$(date -u -d "$changed_at" +%s)"
          now_epoch="$(date -u +%s)"
          age=$((now_epoch - changed_epoch))
          settle_seconds=300

          # Timeline timestamps are server-observed, but clamp tiny negative clock skew
          # so the workflow can never sleep longer than the intended five minutes.
          if (( age < 0 )); then
            age=0
          fi

          if (( age < settle_seconds )); then
            remaining=$((settle_seconds - age))
            echo "PR #$PR_NUMBER head revision was observed ${age}s ago; waiting ${remaining}s before merge evaluation."
            sleep "$remaining"
          else
            echo "PR #$PR_NUMBER head revision has been stable for at least five minutes."
          fi

          current_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_sha="$(jq -r '.head.sha' <<< "$current_json")"
          if [[ "$current_sha" != "$head_sha" ]]; then
            echo "PR head changed while settling; this run will not arm auto-merge."
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stable=true" >> "$GITHUB_OUTPUT"

      - name: Validate approval gate
        if: steps.pr.outputs.skip != 'true' && steps.settle.outputs.stable == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"

          state="$(jq -r '.state' <<< "$pr_json")"
          draft="$(jq -r '.draft' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"

          if [[ "$state" != "open" || "$draft" == "true" ]]; then
            echo "PR #$PR_NUMBER is not an open, non-draft PR."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          on_hold="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "on-hold")' <<< "$pr_json"
          )"
          if [[ "$on_hold" == "true" ]]; then
            echo "PR #$PR_NUMBER is on-hold; auto-merge is disabled."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          approved="$(
            jq -r '[.labels[].name | ascii_downcase] | any(. == "approved")' <<< "$pr_json"
          )"
          if [[ "$approved" != "true" ]]; then
            echo "PR #$PR_NUMBER does not have the Approved label."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare_json="$(gh api "repos/$REPOSITORY/compare/$base_ref...$head_sha")"
          behind_by="$(jq -r '.behind_by' <<< "$compare_json")"
          if [[ "$behind_by" != "0" ]]; then
            echo "PR #$PR_NUMBER is $behind_by commit(s) behind $base_ref."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          required_checks="$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --required --json name,bucket)"
          incomplete="$(
            jq '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | length' <<< "$required_checks"
          )"
          if [[ "$incomplete" != "0" ]]; then
            echo "Required CI is not fully successful yet."
            echo "$required_checks" | jq -r '.[] | "  \(.name): \(.bucket)"'
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Approval, freshness, and CI gates are satisfied for PR #$PR_NUMBER."
          echo "The in-progress label does not block an Approved PR."
          echo "Review-thread resolution is enforced by the protected branch ruleset."
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER"             --repo "$REPOSITORY"             --auto             --merge             --match-head-commit "$HEAD_SHA"
