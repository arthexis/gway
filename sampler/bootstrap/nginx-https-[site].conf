server {
    listen 80;
    listen [[::]]:80;
    server_name [domain];
    server_tokens off;

    if ($http_host = "") {
        return 444;
    }
    if ($host != [domain]) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root [acme_webroot|/var/www/gway-acme];
        default_type text/plain;
    }

    location / {
        return 301 https://[domain]$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [[::]]:443 ssl;
    server_name [domain];
    server_tokens off;

    if ($http_host = "") {
        return 444;
    }
    if ($host != [domain]) {
        return 444;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/[domain]/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/[domain]/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    [headers|]

    location = / {
        root [root|/var/www/gway-install];
        try_files /index.html =404;
        default_type text/html;
        charset utf-8;
    }

    location = /gway {
        alias [root|/var/www/gway-install]/gway;
        default_type text/plain;
        charset utf-8;
    }

    location = /satellite {
        set $installer_file satellite;
        if ($arg_yes ~* "^(1|true|yes)$") {
            set $installer_file satellite-yes;
        }
        alias [root|/var/www/gway-install]/$installer_file;
        default_type text/plain;
        charset utf-8;
    }

    location = /control {
        set $installer_file control;
        if ($arg_yes ~* "^(1|true|yes)$") {
            set $installer_file control-yes;
        }
        alias [root|/var/www/gway-install]/$installer_file;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        return 404;
    }
}
